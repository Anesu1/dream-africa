    - generic [ref=e20]: Legal
    - heading "Privacy & Terms" [level=1] [ref=e22]
    - generic [ref=e24]:
      - paragraph [ref=e25]: This page explains what happens to the information you share when you use this site — through the enquiry form or by messaging us on WhatsApp. It's written in plain terms because that's how we'd want it explained to us.
      - heading "What we collect" [level=2] [ref=e26]
      - paragraph [ref=e27]: The enquiry form on the Safaris and Car Rental pages asks for your name, email address, and optionally your phone number, along with trip details relevant to what you're booking (travel dates, guest count, vehicle preference, and so on) and any message you write. We only collect what's shown on the form — nothing is gathered silently in the background.
      - heading "What we do with it" [level=2] [ref=e28]
      - paragraph [ref=e29]: Submitting the form sends that information directly to our team by email, solely to respond to your enquiry and arrange your booking. We don't sell, rent, or share it with third parties for marketing, and we don't add you to a mailing list unless you separately ask us to.
      - heading "WhatsApp" [level=2] [ref=e30]
      - paragraph [ref=e31]:
        - text: Buttons labelled “Plan Your Journey,” “Reserve,” or similar open a chat with us on WhatsApp. That conversation happens on WhatsApp's own platform and is subject to
        - link "WhatsApp's privacy policy" [ref=e32] [cursor=pointer]:
          - /url: https://www.whatsapp.com/legal/privacy-policy
        - text: ", not ours — we don't control how WhatsApp itself handles that data."
      - heading "Cookies & tracking" [level=2] [ref=e33]
      - paragraph [ref=e34]: This site does not use analytics or advertising cookies. Some photography is served from Unsplash's servers, which may log standard request data (like your IP address) the same way any image host does.
      - heading "Questions" [level=2] [ref=e35]
      - paragraph [ref=e36]: If you have questions about how your information is handled, message us on WhatsApp using any of the contact buttons on this site and we'll answer directly.
