      - generic [ref=e137]:
        - generic [ref=e138]:
          - button "Can I combine a rental with a guided tour?" [ref=e139]:
            - generic [ref=e140]: Can I combine a rental with a guided tour?
            - generic [ref=e141]: +
          - paragraph [ref=e142]: Yes — it's our most popular booking. Keep the vehicle for the week and we'll slot guided days in around it. Combined bookings get 10% off the tour portion.
        - generic [ref=e143]:
          - button "What licence do I need to rent?" [ref=e144]:
            - generic [ref=e145]: What licence do I need to rent?
            - generic [ref=e146]: +
          - paragraph [ref=e147]: A valid licence held for two years, in English or with an international permit, plus a passport. Minimum driver age is 23 for the Fortuner and Land Cruiser.
        - generic [ref=e148]:
          - button "How small are the tour groups?" [ref=e149]:
            - generic [ref=e150]: How small are the tour groups?
            - generic [ref=e151]: +
          - paragraph [ref=e152]: Six guests maximum on every departure, and we never merge groups. Private departures are available on any tour for a flat supplement.
        - generic [ref=e153]:
          - button "Can I take the vehicle across the border?" [ref=e154]:
            - generic [ref=e155]: Can I take the vehicle across the border?
            - generic [ref=e156]: +
          - paragraph [ref=e157]: South Africa, Zambia, Botswana and Namibia are all permitted. We prepare the cross-border letter, third-party insurance and carbon tax paperwork before collection.
        - generic [ref=e158]:
          - button "What is your cancellation policy?" [ref=e159]:
            - generic [ref=e160]: What is your cancellation policy?
            - generic [ref=e161]: +
          - paragraph [ref=e162]: Full refund up to 30 days out, 50% to 14 days. Inside 14 days we'll move your dates once at no charge rather than keep your deposit.
