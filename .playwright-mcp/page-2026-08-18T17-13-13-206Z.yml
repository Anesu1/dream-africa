    - heading "What your rental insurance actually covers on Hwange's gravel roads" [level=1] [ref=e22]
    - img "What your rental insurance actually covers on Hwange's gravel roads" [ref=e24]
    - generic [ref=e26]:
      - paragraph [ref=e27]: Most rental car insurance — in Zimbabwe or anywhere else — is written with tarred roads in mind. The moment you turn off the main road onto Hwange's gravel and sand tracks, a lot of standard collision damage waivers quietly stop covering you. The three exclusions we see catch travellers out most often are chipped windscreens from flying stones, underbody damage on rutted sections after rain, and tyre damage.
      - paragraph [ref=e28]: Before you book anywhere, ask specifically whether unpaved-road cover is included or a separate add-on, whether windscreens and tyres are covered at all, and what the excess looks like if something goes wrong an hour from the nearest workshop. We'll walk you through exactly what's covered on your specific vehicle before you sign anything — message us on WhatsApp if you want a straight answer before you commit.
